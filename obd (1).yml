          retry_interval: 1000
        selected: false
        title: 代码执行
        type: code
        variables:
        - value_selector:
          - '1766990081033'
          - result
          value_type: array[object]
          variable: knowledge_results
      height: 51
      id: '1767076701345'
      position:
        x: -545.1594883222662
        y: 76.229685694849
      positionAbsolute:
        x: -545.1594883222662
        y: 76.229685694849
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        code: "import json\n\ndef main(rerank_output_body: str, original_knowledge:\
          \ list) -> dict:\n    # 1. 解析 Rerank 结果 (保持变量名不变)\n    data = json.loads(rerank_output_body)\n\
          \    rerank_items = data.get('results', [])\n    \n    # 2. 设定过滤参数\n   \
          \ TOP_K = 3            \n    THRESHOLD = 0.5      \n    \n    final_docs\
          \ = []\n    \n    # 3. 按照分数筛选并找回原文字内容\n    # 仅处理 Top_K 数量\n    for item\
          \ in rerank_items[:10]: # 先取前10条进行筛选\n        score = item['relevance_score']\n\
          \        idx = item['index']\n        \n        # 满足阈值且未超过 TOP_K 限制\n  \
          \      if score >= THRESHOLD and len(final_docs) < TOP_K:\n            #\
          \ 安全获取原始数据\n            if idx < len(original_knowledge):\n            \
          \    doc = original_knowledge[idx]\n                \n                #\
          \ \U0001F6E0️ 核心修复：检查 doc 是否为字典\n                if isinstance(doc, dict):\n\
          \                    # 如果是字典，可以安全赋值\n                    doc['rerank_score']\
          \ = round(score, 4)\n                    final_docs.append(doc)\n      \
          \          else:\n                    # 如果是字符串，手动包装成字典以保持后续兼容\n        \
          \            final_docs.append({\n                        \"content\": str(doc),\n\
          \                        \"rerank_score\": round(score, 4),\n          \
          \              \"title\": \"参考分段\"\n                    })\n           \
          \ \n    # 4. 格式化输出文本 (保持变量名不变)\n    context_text = \"\"\n    for i, d in\
          \ enumerate(final_docs, 1):\n        # 提取标题，如果不存在则设为“未知”\n        title\
          \ = d.get('title') or d.get('metadata', {}).get('document_name', '参考资料')\n\
          \        context_text += f\"资料来源 [{i}] ({title}):\\n{d.get('content')}\\\
          n\\n\"\n        \n    return {\n        \"final_context_text\": context_text,\
          \ # 最终提供给 LLM 的变量\n        \"relevant_count\": len(final_docs),\n      \
          \  \"top_score\": final_docs[0]['rerank_score'] if final_docs else 0\n \
          \   }"
        code_language: python3
        outputs:
          final_context_text:
            children: null
            type: string
          relevant_count:
            children: null
            type: number
          top_score:
            children: null
            type: number
