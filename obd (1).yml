    - data:
        code: "def main(knowledge_results: list) -> dict:\n    # \U0001F3AF 核心转换逻辑：仅提取\
          \ content 字段\n    # 这将生成 Xinference 要求的 Array[String] 格式\n    pure_documents\
          \ = [item.get('content', '') for item in knowledge_results]\n    \n    return\
          \ {\n        \"pure_documents\": pure_documents\n    }"
        code_language: python3
        outputs:
